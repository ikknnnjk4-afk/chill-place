<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LE COULOIR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Écran titre -->
  <div id="titleScreen">
    <div id="titleGlow"></div>
    <h1 id="titleText">LE COULOIR</h1>
    <p id="titleSub">touchez pour entrer</p>
  </div>

  <!-- Scène 3D -->
  <div id="scene">
    <div id="world">
      <div id="floor"></div>
      <div id="ceiling"></div>
      <div id="wallLeft"></div>
      <div id="wallRight"></div>
      <div id="wallEnd"></div>
      <div id="girlWrap"><img id="girl" src="assets/girl.png" alt=""></div>
      <div id="girlLight"></div>
    </div>
  </div>

  <!-- Overlays visuels -->
  <canvas id="fxCanvas"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="opticalHalo"></div>
  <div id="flash" class="hidden"></div>
  <div id="blackout" class="hidden"></div>

  <!-- Distorsion optique progressive : elle reste invisible au début et monte seulement
       à l'approche de la fille, pour garder un rendu organique plutôt que numérique. -->
  <svg id="opticalFilters" aria-hidden="true">
    <defs>
      <filter id="opticalWarp" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.006 0.011"
          numOctaves="2"
          seed="17"
          result="slowGlass"
        />
        <feDisplacementMap
          id="opticalDisplacement"
          in="SourceGraphic"
          in2="slowGlass"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <!-- HUD / contrôles mobiles -->
  <div id="hud">
    <div id="joystickZone">
      <div id="joystickBase">
        <div id="joystickThumb"></div>
      </div>
    </div>
    <div id="lookZone"></div>
  </div>

  <div id="endScreen" class="hidden">
    <p id="endText"></p>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
