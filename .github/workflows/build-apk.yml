name: Build Chill Place APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Generate launcher icons from title image
        run: |
          sudo apt-get install -y imagemagick --quiet
          declare -A sizes=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          for folder in "${!sizes[@]}"; do
            size="${sizes[$folder]}"
            mkdir -p "app/src/main/res/$folder"
            convert \
              "app/src/main/assets/ui/titre_ecran_menu_principal.png" \
              -resize "${size}x${size}^" \
              -gravity center \
              -extent "${size}x${size}" \
              "app/src/main/res/$folder/ic_launcher.png"
          done
          echo "✅ Icons generated"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          # Prefer signed release, fallback to unsigned
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk chill-place.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk chill-place.apk
          fi
          echo "✅ APK ready: $(du -sh chill-place.apk | cut -f1)"

      - name: Delete existing 'latest' release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🛋️ Chill Place — Dernière version"
          body: |
            ## 🛋️ Chill Place APK (v1.6 – Java launcher shows crash without starting 3D)

            Jeu Android 3D natif avec IA Groq (Mocho le chat).

            **Correctifs :**
            - Build **Release** (plus stable sur HyperOS / Redmi)
            - `extractNativeLibs` + hardware acceleration
            - Moins de faux positifs Play Protect

            ### 📥 Installation
            1. **Télécharge** `chill-place.apk` ci-dessous
            2. Sur ton Android : **Paramètres → Sécurité → Sources inconnues** → Activer
            3. Si Play Protect bloque → **Installer quand même**
            4. Ouvre le fichier APK et installe

            ### 🎮 Contrôles
            - **Joystick gauche** → se déplacer
            - **Glisser droite** → regarder autour
            - **Bouton AI** (bas droite) → parler à Mocho (IA Groq)

            ---
            *Build automatique via GitHub Actions*
          files: chill-place.apk
          make_latest: true
