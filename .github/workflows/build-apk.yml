name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Le Couloir)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 3. Installer Capacitor ───────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: game
        run: npm install

      # ── 4. Java 17 (requis par Android Gradle) ───────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 5. Android SDK ───────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Ajouter la plateforme Android via Capacitor ───────────────────
      - name: Add Android platform
        working-directory: game
        run: npx cap add android

      # ── 7. Synchroniser les assets web dans le projet Android ─────────────
      - name: Sync web assets
        working-directory: game
        run: npx cap sync android

      # ── 8. Activer hardwareAccelerated dans le manifest Android ───────────
      - name: Patch AndroidManifest (hardwareAccelerated)
        working-directory: game/android/app/src/main
        run: |
          sed -i 's/android:hardwareAccelerated="false"/android:hardwareAccelerated="true"/g' AndroidManifest.xml || true
          grep -q 'hardwareAccelerated' AndroidManifest.xml || \
            sed -i 's/<application/<application android:hardwareAccelerated="true"/' AndroidManifest.xml

      # ── 9. Build debug APK ────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Renommer l'APK ───────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p dist
          cp game/android/app/build/outputs/apk/debug/app-debug.apk \
             dist/le-couloir.apk

      # ── 11. Uploader l'APK comme artefact CI ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: le-couloir-apk
          path: dist/le-couloir.apk
          retention-days: 30

      # ── 12. Créer une Release GitHub si c'est un tag ─────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Le Couloir ${{ github.ref_name }}"
          body: |
            ## Le Couloir ${{ github.ref_name }}

            Jeu d'horreur psychologique — couloir pseudo-3D.

            ### Installation
            1. Télécharger `le-couloir.apk`
            2. Autoriser les sources inconnues sur votre téléphone
            3. Ouvrir le fichier APK pour installer
          files: dist/le-couloir.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
