name: Construire l'APK de Le Couloir

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [latest]

permissions:
  contents: write

jobs:
  build-apk:
    name: APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Capacitor
        run: npm install

      - name: Préparer le projet Android
        run: |
          npm run prepare-web
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(
              r'<activity\s+',
              '<activity android:screenOrientation="landscape" android:hardwareAccelerated="true" ',
              text,
              count=1,
          )
          manifest.write_text(text)
          PY

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer le fichier à télécharger
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Le-Couloir.apk

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: Le-Couloir-APK
          path: Le-Couloir.apk
          if-no-files-found: error

      - name: Mettre à jour la release latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Le Couloir — dernière version
          files: game/Le-Couloir.apk
          overwrite_files: true